.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}

.brand{font-weight:900;color:var(--tx);font-size:1.05rem;padding:0 2px 6px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 3px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:var(--card);border:0;border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--acc);color:var(--on);box-shadow:0 0 0 2px var(--ring)}
.tabs button:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
section{display:none;padding-top:24px}
section.on{display:block}
h2{font-size:1.4rem;margin:0 0 16px;font-weight:900;color:var(--tx)}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--acc);margin-left:.5em;vertical-align:.05em}
.hero{text-align:center;padding:8px 0 20px}
.hero svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.hero h1{margin:8px 0 0;font-size:clamp(2.4rem,11vw,3.8rem);font-weight:900;line-height:1.3}
.hero p{margin:0;color:var(--muted)}
.ban{margin:0 0 16px;border-radius:14px;overflow:hidden}
.ban svg{display:block;width:100%;height:auto}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 54px 54px 54px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);text-align:center}
.row.head{font-size:1.25rem;background:var(--acc);color:var(--on);padding:10px 16px;border-top:0}
.row .n{text-align:right;font-weight:600}
.row .n b{display:inline-block;width:1.6em;color:var(--acc);font-weight:900}
.row .g{font-weight:900;font-size:1.15rem}
.row .z{color:var(--muted)}
.team{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.team .fl{font-size:2rem;line-height:1}
.team .t{flex:1;min-width:0}
.team .t strong{display:block;font-size:1.05rem}
.team .t span{color:var(--muted);font-size:.9rem}
.chip{flex:none;font-size:.85rem;font-weight:600;border-radius:999px;padding:3px 12px;border:1px solid var(--line);color:var(--muted)}
.chip.win{background:var(--acc);border-color:var(--acc);color:var(--on)}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:32px 16px;text-align:center}
.soon .d{font-size:1.15rem;font-weight:900}
.soon .s{margin-top:4px;color:var(--muted)}
.soon{margin-bottom:12px}
.tag{display:inline-block;border:1px solid var(--tx);color:var(--tx);border-radius:999px;padding:2px 14px;font-weight:600;font-size:.85rem;margin:0 0 14px}
.desc{margin:0 0 20px;color:var(--tx)}
.desc p{margin:0 0 14px;line-height:2}
.desc p.last{font-weight:900}
.dt{color:var(--tx);font-weight:600;margin:-8px 0 6px;font-size:.9rem}
.cd{display:flex;gap:8px;justify-content:center;margin-top:16px}
.cd div{min-width:64px;padding:8px 6px;border-radius:12px;background:var(--acc);color:var(--on);text-align:center;line-height:1.4}
.cd b{display:block;font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.cd span{font-size:.75rem}
.cd.done{display:block;text-align:center;font-weight:600}
.next{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.nl{color:var(--muted);font-size:.9rem}
.nn{font-weight:900;font-size:1.1rem}
.go{margin-top:12px;font:inherit;font-weight:600;color:var(--acc);background:none;border:0;cursor:pointer;text-decoration:underline}
</style>
</head>

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

var home=el("section","",
 '<div class="hero"><svg viewBox="0 0 360 150" role="img" aria-label="کوه فوجی و خورشید"><circle cx="250" cy="52" r="26" fill="#C8372D"/><path d="M0 150L120 40Q140 22 160 40L300 150Z" fill="#E7D7B2"/><path d="M120 40Q140 22 160 40L172 52L156 48L146 58L134 48L122 56L108 52Z" fill="#fff"/><path d="M0 150L90 100L170 150Z" fill="#F1E6CB"/></svg><h1>مسابقات فوجی ⛩</h1><p>نتایج رقابت‌ها</p></div><h2><span class="dot"></span>جدول زنده</h2>');
var tbl=el("div","tbl");
tbl.appendChild(el("div","row head","<span></span><span>🏆</span><span>🥈</span><span>🥉</span>"));
players.forEach(function(p){
  tbl.appendChild(el("div","row","<span class='n'><b>"+p.r+"</b>"+p.n+"</span><span class='g'>"+p.g+"</span><span class='z'>"+p.s+"</span><span class='z'>"+p.b+"</span>"));
});
home.appendChild(tbl);
var nx=null;events.forEach(function(e){if(e.ts&&!nx&&new Date(e.ts)>Date.now())nx=e});
if(nx){var nc=el("div","next","<div class='nl'>مسابقه بعدی</div><div class='nn'>"+nx.name+" · "+nx.date+" · ساعت "+nx.time+"</div><div class='cd' role='timer' data-ts='"+nx.ts+"'></div>");var go=el("button","go","دیدن صفحه مسابقه");go.type="button";go.onclick=function(){show(nx.id)};nc.appendChild(go);home.appendChild(nc)}
pages.push({id:"home",tab:"صفحه اصلی",node:home});

events.forEach(function(ev){
  var s=el("section","","<div class='ban'><svg viewBox='0 0 360 110' aria-hidden='true'>"+B[ev.id]()+"</svg></div><h2>🏆 "+ev.name+"</h2>"+(ev.date&&!ev.ts?"<div class='dt'>"+ev.date+"</div>":"")+desc(ev.id));
  if(ev.ts)s.appendChild(el("div","soon","<div class='d'>"+ev.date+" · ساعت "+ev.time+"</div><div class='s'>هنوز برگزار نشده</div><div class='cd' role='timer' data-ts='"+ev.ts+"'></div>"));
  if(ev.teams){
    ev.teams.forEach(function(t){
      s.appendChild(el("div","team","<span class='fl'>"+t.f+"</span><div class='t'><strong>"+t.t+"</strong><span>"+t.p+"</span></div><span class='chip "+t.k+"'>"+t.s+"</span>"));
    });
  }
  pages.push({id:ev.id,tab:ev.name,node:s});
});

pages.forEach(function(p){
  var b=el("button","",p.tab);b.type="button";b.setAttribute("role","tab");
  b.onclick=function(){show(p.id)};
  p.btn=b;tabs.appendChild(b);main.appendChild(p.node);
});
function show(id){
  var found=false;
  pages.forEach(function(p){
    var on=p.id===id;if(on)found=true;
    p.node.className=on?"on":"";
    if(on){p.btn.setAttribute("aria-current","true");p.btn.scrollIntoView({block:"nearest",inline:"center"})}
    else p.btn.removeAttribute("aria-current");
  });
  if(!found)return show("home");
  document.body.setAttribute("data-t",id);
  document.documentElement.style.background=getComputedStyle(document.body).getPropertyValue("--bg");
  window.scrollTo(0,0);
  try{history.replaceState(null,"","#"+id)}catch(e){}
}
function fa(n){return String(n).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".charAt(d)})}
function cb(v,l){return "<div><b>"+fa(v<10&&l!=="روز"?"0"+v:v)+"</b><span>"+l+"</span></div>"}
function tick(){var now=Date.now();document.querySelectorAll(".cd").forEach(function(c){
 var ms=new Date(c.getAttribute("data-ts"))-now;
 if(!(ms>0)){c.className="cd done";c.textContent="زمان برگزاری رسیده است ⏳";return}
 var t=Math.floor(ms/1000);
 c.innerHTML=cb(Math.floor(t/86400),"روز")+cb(Math.floor(t%86400/3600),"ساعت")+cb(Math.floor(t%3600/60),"دقیقه")+cb(t%60,"ثانیه")})}
tick();setInterval(tick,1000);
show((location.hash||"").slice(1)||"home");
</script>
</body>
</html>
